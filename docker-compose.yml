services:
  app:
    build:
      context: .
      args:
        UID: 
        GID: 
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: local
      PLATFORM_DB_HOST: mysql
      TENANT_DB_HOST: mysql
      REDIS_HOST: redis
      REDIS_CLIENT: predis
      # enpii/assistant package — vector/RAG store
      RAG_DB_CONNECTION: pgsql
      RAG_DB_HOST: postgres
      RAG_DB_PORT: 5432
      RAG_DB_DATABASE: 
      RAG_DB_USERNAME: 
      RAG_DB_PASSWORD: 
      # Embedding base URL points at the in-cluster ollama service. If you
      # want to talk to an ollama running on the host machine, override
      # EMBEDDING_BASE_URL=http://host.docker.internal:11434/v1 in .env.
      EMBEDDING_BASE_URL: 
      EMBEDDING_MODEL: 
      EMBEDDING_DIM: 
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  queue:
    build:
      context: .
      args:
        UID: 
        GID: 
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan queue:work redis --tries=3 --timeout=90
    environment:
      APP_ENV: local
      PLATFORM_DB_HOST: mysql
      TENANT_DB_HOST: mysql
      REDIS_HOST: redis
      REDIS_CLIENT: predis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    ports:
      - ":80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    ports:
      - ":3306"
    environment:
      MYSQL_ROOT_PASSWORD: 
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - ":6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # enpii/assistant — vector store for RAG embeddings (pgvector).
  # Runs alongside MySQL; package's ai_* tables live here so the HNSW index
  # gives sub-millisecond cosine similarity over document chunks.
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - ":5432"
    environment:
      POSTGRES_DB: 
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {POSTGRES_USER} -d {POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # enpii/assistant — local LLM + embedding server. The init container pulls
  # the embedding model on first boot; afterwards the image is reused and
  # models stay in the ollama-data named volume.
  ollama:
    image: ollama/ollama:latest
    ports:
      - ":11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: 
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Ollama..."
        MODEL="{EMBEDDING_MODEL:-nomic-embed-text}"
        echo "Pulling MODEL..."
        OLLAMA_HOST=http://ollama:11434 ollama pull "MODEL"
        echo "Model ready."
    restart: "no"

volumes:
  mysql-data:
  redis-data:
  pg-data:
  ollama-data:
